    <script>
      // Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : function() { return Promise.reject(new Error('Fetch not available')); };
          var _currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>

  </body>
